name: Deploy Astra Child Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Astra Child via rsync
        run: |
          # Asegurarnos de que el directorio de destino exista
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p public_html/wp-content/themes/astra-child/"
          
          # Sincronizar archivos (usamos ./ porque los archivos están en la raíz del repo)
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='test-*.html' \
            --exclude='*.md' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/wp-content/themes/astra-child/ \
            -e "ssh -p ${{ secrets.SSH_PORT }}"

