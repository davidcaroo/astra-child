<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Rocket + Book Symbol -->
  <g id="logo-icon">
    <!-- Book Base -->
    <path d="M8 35 L8 48 C8 49.5 9 50 10 50 L28 50 C29 50 30 49.5 30 48 L30 35 Z" fill="url(#logoGradient)" opacity="0.2"/>
    <rect x="8" y="32" width="22" height="3" rx="1" fill="url(#logoGradient)" opacity="0.3"/>
    
    <!-- Rocket Body -->
    <path d="M19 10 L19 5 C19 3.5 19.5 3 21 3 L25 3 C26.5 3 27 3.5 27 5 L27 10 Z" fill="url(#logoGradient)"/>
    <rect x="17" y="10" width="12" height="25" rx="2" fill="url(#logoGradient)"/>
    
    <!-- Rocket Window -->
    <circle cx="23" cy="18" r="3.5" fill="white" opacity="0.9"/>
    <circle cx="23" cy="18" r="2" fill="url(#accentGradient)"/>
    
    <!-- Rocket Fins -->
    <path d="M17 28 L12 35 L17 33 Z" fill="url(#logoGradient)" opacity="0.8"/>
    <path d="M29 28 L34 35 L29 33 Z" fill="url(#logoGradient)" opacity="0.8"/>
    
    <!-- Flame/Propulsion -->
    <path d="M19 35 L19 42 L21 45 L23 42 L25 45 L27 42 L27 35 Z" fill="url(#accentGradient)"/>
    <path d="M20 42 L22 48 L24 42 Z" fill="#FFD700" opacity="0.8"/>
    
    <!-- Stars (representing limitless) -->
    <circle cx="10" cy="12" r="1.5" fill="url(#accentGradient)"/>
    <circle cx="36" cy="15" r="1" fill="url(#accentGradient)"/>
    <circle cx="35" cy="8" r="1.2" fill="url(#logoGradient)"/>
    
    <!-- Upward Arrow Trail -->
    <path d="M23 38 L23 40" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M20 40 L20 42" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <path d="M26 40 L26 42" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Text: Emprende Sin Límites -->
  <g id="logo-text">
    <!-- "Emprende" -->
    <text x="50" y="28" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#1E293B">
      Emprende
    </text>
    
    <!-- "Sin Límites" with gradient -->
    <text x="50" y="46" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="url(#logoGradient)">
      Sin Límites
    </text>
    
    <!-- Tagline (optional small text) -->
    <text x="50" y="56" font-family="Inter, sans-serif" font-size="7" font-weight="500" fill="#64748B" letter-spacing="0.5">
      ACADEMIA DE EMPRENDIMIENTO
    </text>
  </g>
  
  <!-- Decorative Element: Infinity Symbol -->
  <path d="M165 43 Q168 40 171 43 Q174 46 177 43 Q180 40 183 43" 
        stroke="url(#accentGradient)" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.5"
        stroke-linecap="round"/>
</svg>
