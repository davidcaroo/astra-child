<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circular Background -->
  <circle cx="25" cy="25" r="24" fill="url(#iconGradient)" opacity="0.1"/>
  
  <!-- Book Base -->
  <path d="M12 32 L12 40 C12 41 12.5 41.5 13.5 41.5 L36.5 41.5 C37.5 41.5 38 41 38 40 L38 32 Z" fill="url(#iconGradient)" opacity="0.2"/>
  <rect x="12" y="30" width="26" height="2" rx="1" fill="url(#iconGradient)" opacity="0.3"/>
  
  <!-- Rocket Body -->
  <path d="M25 8 L25 4 C25 3 25.5 2.5 26.5 2.5 L28.5 2.5 C29.5 2.5 30 3 30 4 L30 8 Z" fill="url(#iconGradient)"/>
  <rect x="22" y="8" width="11" height="22" rx="2" fill="url(#iconGradient)"/>
  
  <!-- Rocket Window -->
  <circle cx="27.5" cy="15" r="3" fill="white" opacity="0.9"/>
  <circle cx="27.5" cy="15" r="1.8" fill="url(#flameGradient)"/>
  
  <!-- Rocket Fins -->
  <path d="M22 24 L17 30 L22 28 Z" fill="url(#iconGradient)" opacity="0.8"/>
  <path d="M33 24 L38 30 L33 28 Z" fill="url(#iconGradient)" opacity="0.8"/>
  
  <!-- Flame -->
  <path d="M23.5 30 L23.5 36 L25 38.5 L27.5 36 L30 38.5 L31.5 36 L31.5 30 Z" fill="url(#flameGradient)"/>
  <path d="M25 36 L27.5 42 L30 36 Z" fill="#FFD700" opacity="0.7"/>
  
  <!-- Stars -->
  <circle cx="15" cy="12" r="1.2" fill="url(#flameGradient)"/>
  <circle cx="40" cy="15" r="0.8" fill="url(#flameGradient)"/>
  <circle cx="38" cy="10" r="1" fill="url(#iconGradient)"/>
  
  <!-- Motion Lines -->
  <path d="M27.5 32 L27.5 34" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M24.5 34 L24.5 36" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
  <path d="M30.5 34 L30.5 36" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
</svg>
